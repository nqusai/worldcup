<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPredictor - Predictions</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f9; padding: 20px; max-width: 800px; margin: auto; color: #333; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #888; font-size: 14px; margin-top: 0; margin-bottom: 25px; }
        .card { background: white; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }

        footer { text-align: center; font-size: 12px; color: #aaa; margin-top: 40px; padding-bottom: 20px; }

        /* Mobile Optimization */
        @media (max-width: 600px) {
            body { padding: 12px; }
        }
    </style>
</head>
<body>

    <h1>🏆 iPredictor</h1>
    <p class="subtitle">Predictions for Upcoming Games</p>

    <div class="card">
        <p>iPredictor is taking a break — the tournament is over. ⚽</p>
        <p style="margin-top: 10px; color: #888; font-size: 14px;">See you at the next one!</p>
    </div>

    <footer>v01 (Paused)</footer>

</html>
